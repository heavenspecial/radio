<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bimbo Kimchi: Chase the Myth</title>
  <style>
    :root {
      --bg: #483065;
      --panel: #000000;
      --accent: #fce5bf; /* cream accent */
      --scrub-blue: #ae96cb; /* colour for seek bar */
      --text: #e6e6ed;
      --muted: #9393a5;
      --border: #2a2a3a;
      --explicit-color: #ff2a5f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      text-align: left;
    }

    main {
      max-width: 768px;
      width: 100%;
    }

    header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      display: grid;
      grid-template-columns: minmax(100px, 160px) 1fr;
      grid-template-areas:
        "image details"
        "description description";
      gap: 1.5rem;
      align-items: center;
      margin-bottom: 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    header img {
      grid-area: image;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .show-details {
      grid-area: details;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-width: 0;
    }

    .meta-line {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 1.8rem;
      letter-spacing: -0.02em;
      color: #fff;
      overflow-wrap: break-word;
    }

    .author {
      font-size: 0.9rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .explicit-badge {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--explicit-color);
      border: 1px solid rgba(255, 42, 95, 0.1);
      background: rgba(255, 42, 95, 0.1);
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
    }

    .tags {
      display: flex;
      justify-content: flex-start;
      gap: 0.5rem;
      margin-top: 0.25rem;
      flex-wrap: wrap;
    }

    .tag {
      background: rgba(252, 229, 191, 0.2);
      color: var(--accent);
      border: 1px solid rgba(252, 229, 191, 0.2);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .show-description {
      grid-area: description;
      font-size: 0.95rem;
      color: var(--text);
    }

    .episodes-title {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    article.episode {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      scroll-margin-top: 2rem;
    }

    article.episode:target {
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(226, 160, 73, 0.2);
    }

    .episode-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .episode-title {
      font-size: 1.25rem;
      color: #fff;
      text-decoration: none;
    }

    .episode-title:hover {
      color: var(--accent);
    }

    .episode-date {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .episode-description {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    /* --- CUSTOM PODCAST PLAYER STYLING --- */
    .custom-player {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 1rem;
      padding-top: 0.5rem;
    }

    .player-controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
    }

    .btn-skip {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
    }

    .btn-skip:active {
      transform: scale(0.9);
    }

    .btn-play-pause {
      background-color: #7851a9;
      border: none;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .btn-play-pause:hover {
      background-color: #7851a9;
    }

    .btn-play-pause:active {
      transform: scale(0.95);
    }

    .btn-play-pause svg {
      fill: #ffffff;
      width: 28px;
      height: 28px;
    }

    /* Seek Slider Bar */
    .timeline-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .seek-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(to right, var(--scrub-blue) 0%, var(--scrub-blue) 0%, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.2) 100%);
      outline: none;
      cursor: pointer;
    }

    /* Slider Handle (Thumb) */
    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--scrub-blue);
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
    }

    .seek-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--scrub-blue);
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
    }

    /* Timestamps underneath */
    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text);
      font-weight: 500;
    }

    @media (max-width: 600px) {
      body { padding: 1rem 0.5rem; }
      header {
        padding: 1.25rem;
        gap: 1rem;
        grid-template-columns: minmax(80px, 110px) 1fr;
      }
      h1 { font-size: 1.35rem; }
      .episode-header {
        flex-direction: column;
        gap: 0.25rem;
      }
      .player-controls-row {
        gap: 1.75rem;
      }
    }
  </style>
</head>
<body>

<main>
  <header id="podcast-header">
    <p>Loading show details...</p>
  </header>

  <section>
    <h2 class="episodes-title">Episodes</h2>
    <div id="episodes-container">
      <p>Loading episodes...</p>
    </div>
  </section>
</main>

<script>
  const RSS_URL = 'https://heavenspecial.github.io/radio/feed.xml';
  const ITUNES_NS = 'http://www.itunes.com/dtds/podcast-1.0.dtd';

  // Helper to convert seconds into HH:MM:SS or MM:SS format
  function formatTime(seconds) {
    if (isNaN(seconds)) return '0:00';
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = Math.floor(seconds % 60);

    const formattedSecs = secs < 10 ? `0${secs}` : secs;
    if (hrs > 0) {
      const formattedMins = mins < 10 ? `0${mins}` : mins;
      return `${hrs}:${formattedMins}:${formattedSecs}`;
    }
    return `${mins}:${formattedSecs}`;
  }

  async function loadPodcastFeed() {
    try {
      const response = await fetch(RSS_URL);
      const textData = await response.text();
      
      const parser = new DOMParser();
      const xml = parser.parseFromString(textData, 'application/xml');

      const channel = xml.querySelector('channel');

      const getNS = (parent, ns, tag) => {
        const el = parent.getElementsByTagNameNS(ns, tag)[0];
        return el ? el.textContent.trim() : '';
      };

      const getTagText = (parent, tag) => {
        const el = parent.querySelector(tag);
        return el ? el.textContent.trim() : '';
      };

      // Extract Channel Header Data
      const podcastTitle = getTagText(channel, 'title');
      const podcastAuthor = getNS(channel, ITUNES_NS, 'author');
      const podcastDesc = getTagText(channel, 'description');
      const isExplicit = getNS(channel, ITUNES_NS, 'explicit').toLowerCase() === 'yes';

      const categories = Array.from(channel.getElementsByTagNameNS(ITUNES_NS, 'category'))
                              .map(cat => cat.getAttribute('text'));

      const imageNode = channel.getElementsByTagNameNS(ITUNES_NS, 'image')[0];
      const imageUrl = imageNode ? imageNode.getAttribute('href') : 'https://heavenspecial.github.io/radio/artwork/album.jpg';

      document.title = podcastTitle;

      document.getElementById('podcast-header').innerHTML = `
        <img src="${imageUrl}" alt="${podcastTitle} Cover Art">
        <div class="show-details">
          <div class="meta-line">
            ${podcastAuthor ? `<span class="author">${podcastAuthor}</span>` : ''}
            ${isExplicit ? `<span class="explicit-badge">Explicit</span>` : ''}
          </div>
          <h1>${podcastTitle}</h1>
          <div class="tags">
            ${categories.map(cat => `<span class="tag">${cat}</span>`).join('')}
          </div>
        </div>
        <div class="show-description">${podcastDesc}</div>
      `;

      // Extract Episodes
      const items = xml.querySelectorAll('item');
      const container = document.getElementById('episodes-container');
      container.innerHTML = '';

      items.forEach((item, index) => {
        const title = getTagText(item, 'title');
        const desc = getTagText(item, 'description');
        const guid = getTagText(item, 'guid') || `ep-${index}`;
        const pubDateRaw = getTagText(item, 'pubDate');

        const pubDate = pubDateRaw ? new Date(pubDateRaw).toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        }) : '';

        const enclosure = item.querySelector('enclosure');
        const audioUrl = enclosure ? enclosure.getAttribute('url') : '';

        const article = document.createElement('article');
        article.className = 'episode';
        article.id = guid;

        article.innerHTML = `
          <div class="episode-header">
            <h3><a href="#${guid}" class="episode-title">${title}</a></h3>
            <time class="episode-date">${pubDate}</time>
          </div>
          <div class="episode-description">${desc}</div>
          
          ${audioUrl ? `
            <div class="custom-player" id="player-${index}">
              <audio src="${audioUrl}" preload="metadata"></audio>
              
              <!-- Play Controls Row -->
              <div class="player-controls-row">
                <!-- Rewind 15s -->
                <button class="btn-skip btn-rewind" title="Rewind 15 seconds">
                  <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                    <text x="12" y="15.5" font-size="7" font-weight="800" fill="currentColor" stroke="none" text-anchor="middle" font-family="-apple-system, sans-serif">15</text>
                  </svg>
                </button>

                <!-- Big Yellow Play/Pause Button -->
                <button class="btn-play-pause" title="Play">
                  <svg class="icon-play" viewBox="0 0 24 24">
                    <polygon points="6,4 20,12 6,20"></polygon>
                  </svg>
                  <svg class="icon-pause" viewBox="0 0 24 24" style="display: none;">
                    <rect x="6" y="4" width="4" height="16"></rect>
                    <rect x="14" y="4" width="4" height="16"></rect>
                  </svg>
                </button>

                <!-- Fast Forward 30s -->
                <button class="btn-skip btn-ff" title="Fast forward 30 seconds">
                  <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                    <path d="M21 3v5h-5"/>
                    <text x="12" y="15.5" font-size="7" font-weight="800" fill="currentColor" stroke="none" text-anchor="middle" font-family="-apple-system, sans-serif">30</text>
                  </svg>
                </button>
              </div>

              <!-- Seek Slider Container -->
              <div class="timeline-container">
                <input type="range" class="seek-slider" min="0" max="100" value="0">
                <div class="time-display">
                  <span class="time-current">0:00</span>
                  <span class="time-duration">0:00</span>
                </div>
              </div>
            </div>
          ` : ''}
        `;

        container.appendChild(article);

        // Bind interactive events if audio exists
        if (audioUrl) {
          setupPlayerControls(document.getElementById(`player-${index}`));
        }
      });

    } catch (err) {
      console.error('Error fetching/parsing XML feed:', err);
    }
  }

  // Interactive JavaScript logic for custom player
  function setupPlayerControls(playerEl) {
    const audio = playerEl.querySelector('audio');
    const playPauseBtn = playerEl.querySelector('.btn-play-pause');
    const iconPlay = playerEl.querySelector('.icon-play');
    const iconPause = playerEl.querySelector('.icon-pause');
    const rewindBtn = playerEl.querySelector('.btn-rewind');
    const ffBtn = playerEl.querySelector('.btn-ff');
    const slider = playerEl.querySelector('.seek-slider');
    const timeCurrent = playerEl.querySelector('.time-current');
    const timeDuration = playerEl.querySelector('.time-duration');

    // Update duration when metadata loads
    audio.addEventListener('loadedmetadata', () => {
      timeDuration.textContent = formatTime(audio.duration);
    });

    // Play/Pause toggle
    playPauseBtn.addEventListener('click', () => {
      // Pause all other audio players when playing a new episode
      document.querySelectorAll('audio').forEach(otherAudio => {
        if (otherAudio !== audio) {
          otherAudio.pause();
        }
      });

      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play', () => {
      iconPlay.style.display = 'none';
      iconPause.style.display = 'block';
    });

    audio.addEventListener('pause', () => {
      iconPlay.style.display = 'block';
      iconPause.style.display = 'none';
    });

    // Time update listener for slider and timer
    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        const percentage = (audio.currentTime / audio.duration) * 100;
        slider.value = percentage;
        
        // Dynamic track color fill matching screen reference
        slider.style.background = `linear-gradient(to right, var(--scrub-blue) 0%, var(--scrub-blue) ${percentage}%, rgba(255, 255, 255, 0.2) ${percentage}%, rgba(255, 255, 255, 0.2) 100%)`;
        
        timeCurrent.textContent = formatTime(audio.currentTime);
      }
    });

    // Scrubbing via slider
    slider.addEventListener('input', () => {
      if (!isNaN(audio.duration)) {
        const seekTo = (slider.value / 100) * audio.duration;
        audio.currentTime = seekTo;
      }
    });

    // Skip Buttons
    rewindBtn.addEventListener('click', () => {
      audio.currentTime = Math.max(0, audio.currentTime - 15);
    });

    ffBtn.addEventListener('click', () => {
      audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + 30);
    });
  }

  loadPodcastFeed();
</script>

</body>
</html>
