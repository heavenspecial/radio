<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bimbo Kimchi: Chase the Myth</title>
  <style>
    :root {
      --bg: #1e3149;
      --panel: #16161f;
      --accent: #e2a049;
      --text: #e6e6ed;
      --muted: #9393a5;
      --border: #2a2a3a;
      --explicit-color: #ff2a5f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
  background-color: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.6;
  padding: 2rem 1rem;
  display: flex;
  justify-content: center; /* Centered horizontally on desktop */
  text-align: left;        /* Keeps inner text left-aligned */
}

    main {
      max-width: 768px;
      width: 100%;
    }

    header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      display: grid;
      grid-template-columns: minmax(100px, 160px) 1fr;
      grid-template-areas:
        "image details"
        "description description";
      gap: 1.5rem;
      align-items: center;
      margin-bottom: 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    header img {
      grid-area: image;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .show-details {
      grid-area: details;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-width: 0;
    }

    .meta-line {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 1.8rem;
      letter-spacing: -0.02em;
      color: #fff;
      overflow-wrap: break-word;
    }

    .author {
      font-size: 0.9rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .explicit-badge {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--explicit-color);
      border: 1px solid rgba(255, 42, 95, 0.1);
      background: rgba(255, 42, 95, 0.1);
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
    }

    .tags {
      display: flex;
      justify-content: flex-start;
      gap: 0.5rem;
      margin-top: 0.25rem;
      flex-wrap: wrap;
    }

    .tag {
      background: rgba(226, 160, 73, 0.1);
      color: var(--accent);
      border: 1px solid rgba(226, 160, 73, 0.1);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .show-description {
      grid-area: description;
      font-size: 0.95rem;
      color: var(--text);
    }

    .episodes-title {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    article.episode {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      scroll-margin-top: 2rem;
    }

    article.episode:target {
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(226, 160, 73, 0.2);
    }

    .episode-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .episode-title {
      font-size: 1.25rem;
      color: #fff;
      text-decoration: none;
    }

    .episode-title:hover {
      color: var(--accent);
    }

    .episode-date {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .episode-description {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }

    audio {
      width: 100%;
      height: 40px;
      outline: none;
      border-radius: 4px;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem 0.5rem;
      }

      header {
        padding: 1.25rem;
        gap: 1rem;
        grid-template-columns: minmax(80px, 110px) 1fr;
      }

      h1 {
        font-size: 1.35rem;
      }

      .episode-header {
        flex-direction: column;
        gap: 0.25rem;
      }
    }
  </style>
</head>
<body>

<main>
  <header id="podcast-header">
    <p>Loading show details...</p>
  </header>

  <section>
    <h2 class="episodes-title">Episodes</h2>
    <div id="episodes-container">
      <p>Loading episodes...</p>
    </div>
  </section>
</main>

<script>
  const RSS_URL = 'https://heavenspecial.github.io/radio/feed.xml';
  const ITUNES_NS = 'http://www.itunes.com/dtds/podcast-1.0.dtd';

  async function loadPodcastFeed() {
    try {
      const response = await fetch(RSS_URL);
      const textData = await response.text();
      
      const parser = new DOMParser();
      const xml = parser.parseFromString(textData, 'application/xml');

      const channel = xml.querySelector('channel');

      // Helper functions to safely extract data
      const getNS = (parent, ns, tag) => {
        const el = parent.getElementsByTagNameNS(ns, tag)[0];
        return el ? el.textContent.trim() : '';
      };

      const getTagText = (parent, tag) => {
        const el = parent.querySelector(tag);
        return el ? el.textContent.trim() : '';
      };

      // Extract Channel metadata
      const podcastTitle = getTagText(channel, 'title');
      const podcastAuthor = getNS(channel, ITUNES_NS, 'author');
      const podcastDesc = getTagText(channel, 'description');
      const isExplicit = getNS(channel, ITUNES_NS, 'explicit').toLowerCase() === 'yes';

      // Parse Categories
      const categories = Array.from(channel.getElementsByTagNameNS(ITUNES_NS, 'category'))
                              .map(cat => cat.getAttribute('text'));

      // Artwork image fallback
      const imageNode = channel.getElementsByTagNameNS(ITUNES_NS, 'image')[0];
      const imageUrl = imageNode ? imageNode.getAttribute('href') : 'https://heavenspecial.github.io/radio/artwork/album.jpg';

      // Set Document Title
      document.title = podcastTitle;

      // Render Header
      document.getElementById('podcast-header').innerHTML = `
        <img src="${imageUrl}" alt="${podcastTitle} Cover Art">
        <div class="show-details">
          <div class="meta-line">
            ${podcastAuthor ? `<span class="author">${podcastAuthor}</span>` : ''}
            ${isExplicit ? `<span class="explicit-badge">Explicit</span>` : ''}
          </div>
          <h1>${podcastTitle}</h1>
          <div class="tags">
            ${categories.map(cat => `<span class="tag">${cat}</span>`).join('')}
          </div>
        </div>
        <div class="show-description">${podcastDesc}</div>
      `;

      // Render Episodes
      const items = xml.querySelectorAll('item');
      const container = document.getElementById('episodes-container');
      container.innerHTML = '';

      items.forEach(item => {
        const title = getTagText(item, 'title');
        const desc = getTagText(item, 'description');
        const guid = getTagText(item, 'guid') || '';
        const pubDateRaw = getTagText(item, 'pubDate');

        // Format Date (e.g., Feb 25, 2026)
        const pubDate = pubDateRaw ? new Date(pubDateRaw).toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        }) : '';

        // Extract Audio File details
        const enclosure = item.querySelector('enclosure');
        const audioUrl = enclosure ? enclosure.getAttribute('url') : '';
        const audioType = enclosure ? enclosure.getAttribute('type') : 'audio/mpeg';

        const article = document.createElement('article');
        article.className = 'episode';
        if (guid) article.id = guid;

        article.innerHTML = `
          <div class="episode-header">
            <h3><a href="#${guid}" class="episode-title">${title}</a></h3>
            <time class="episode-date">${pubDate}</time>
          </div>
          <div class="episode-description">${desc}</div>
          ${audioUrl ? `
            <audio controls preload="metadata">
              <source src="${audioUrl}" type="${audioType}">
              Your browser does not support the audio element.
            </audio>
          ` : ''}
        `;

        container.appendChild(article);
      });

    } catch (err) {
      console.error('Error fetching/parsing XML feed:', err);
    }
  }

  loadPodcastFeed();
</script>

</body>
</html>
