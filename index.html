<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bimbo Kimchi: Chase the Myth</title>
  <style>
    :root {
      /* Theme Palette */
      --electric-blue: #0066ff;
      --christmas-red: #d90429;
      --lavender-miniskirt: #e2afff;
      
      /* Glassmorphism System */
      --glass-bg: rgba(22, 22, 30, 0.55);
      --glass-card: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-specular: rgba(255, 255, 255, 0.2);
      
      --text-main: #f5f5f7;
      --text-sub: rgba(245, 245, 247, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 10% 10%, #1a002c 0%, #080811 50%, #000c1d 100%) fixed;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      line-height: 1.5;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 800px;
      width: 100%;
    }

    /* --- GLASS HEADER --- */
    header {
      background: var(--glass-bg);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-top-color: var(--glass-specular);
      border-radius: 24px;
      padding: 2.2rem;
      display: grid;
      grid-template-columns: 160px 1fr;
      grid-template-areas:
        "image details"
        "description description";
      gap: 1.75rem;
      align-items: center;
      margin-bottom: 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    header img {
      grid-area: image;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      object-fit: cover;
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .show-details {
      grid-area: details;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .meta-line {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 30%, var(--lavender-miniskirt));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .author {
      font-size: 0.8rem;
      color: var(--lavender-miniskirt);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .explicit-badge {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fff;
      background: var(--christmas-red);
      padding: 0.15rem 0.45rem;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(217, 4, 41, 0.4);
    }

    .tags {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.25rem;
      flex-wrap: wrap;
    }

    .tag {
      background: rgba(0, 102, 255, 0.15);
      color: var(--electric-blue);
      border: 1px solid rgba(0, 102, 255, 0.3);
      padding: 0.25rem 0.7rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      backdrop-filter: blur(10px);
    }

    .show-description {
      grid-area: description;
      font-size: 0.95rem;
      color: var(--text-sub);
    }

    /* --- SEASON NAVIGATION TABS --- */
    .season-nav {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
      overflow-x: auto;
      padding: 4px;
    }

    .season-tab {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-sub);
      padding: 0.6rem 1.4rem;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(15px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }

    .season-tab:hover {
      color: #fff;
      border-color: var(--lavender-miniskirt);
    }

    .season-tab.active {
      background: var(--electric-blue);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 20px rgba(0, 102, 255, 0.5);
    }

    /* --- EPISODE CARD --- */
    article.episode {
      background: var(--glass-card);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-top-color: var(--glass-specular);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      scroll-margin-top: 2rem;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    article.episode:hover {
      border-color: rgba(226, 175, 255, 0.4);
      transform: translateY(-2px);
    }

    article.episode:target {
      border-color: var(--lavender-miniskirt);
      box-shadow: 0 0 25px rgba(226, 175, 255, 0.25);
    }

    .episode-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
      gap: 1rem;
    }

    .episode-title-group {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .episode-badge-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .ep-type-badge {
      font-size: 0.65rem;
      text-transform: uppercase;
      font-weight: 700;
      padding: 0.1rem 0.5rem;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .ep-type-badge.trailer {
      background: rgba(217, 4, 41, 0.2);
      color: var(--christmas-red);
      border: 1px solid rgba(217, 4, 41, 0.3);
    }

    .ep-type-badge.full {
      background: rgba(226, 175, 255, 0.15);
      color: var(--lavender-miniskirt);
      border: 1px solid rgba(226, 175, 255, 0.3);
    }

    .episode-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .episode-title:hover {
      color: var(--lavender-miniskirt);
    }

    .episode-date {
      font-size: 0.8rem;
      color: var(--text-sub);
      white-space: nowrap;
    }

    .episode-description {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 1.25rem;
    }

    /* --- GLASS PLAYER CONTROL --- */
    .custom-player {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      background: rgba(0, 0, 0, 0.2);
      padding: 1rem 1.25rem;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .player-controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }

    .btn-skip {
      background: none;
      border: none;
      color: var(--lavender-miniskirt);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, color 0.2s ease;
    }

    .btn-skip:hover {
      color: #fff;
    }

    .btn-skip:active {
      transform: scale(0.9);
    }

    .btn-play-pause {
      background: linear-gradient(135deg, var(--electric-blue), #0044b3);
      border: none;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 102, 255, 0.4);
      transition: transform 0.15 ease, box-shadow 0.2s ease;
    }

    .btn-play-pause:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 22px rgba(0, 102, 255, 0.6);
    }

    .btn-play-pause:active {
      transform: scale(0.95);
    }

    .btn-play-pause svg {
      fill: #ffffff;
      width: 22px;
      height: 22px;
    }

    /* Timeline & Scrubbing */
    .timeline-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .seek-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 3px;
      background: linear-gradient(to right, var(--lavender-miniskirt) 0%, var(--lavender-miniskirt) 0%, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.15) 100%);
      outline: none;
      cursor: pointer;
    }

    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px rgba(226, 175, 255, 0.8);
      cursor: pointer;
    }

    .seek-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px rgba(226, 175, 255, 0.8);
      cursor: pointer;
      border: none;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    footer {
      max-width: 800px;
      width: 100%;
      margin-top: 2rem;
      padding: 1.5rem 0;
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      color: var(--text-sub);
      border-top: 1px solid var(--glass-border);
    }

    @media (max-width: 650px) {
      body { padding: 1rem 0.5rem; }
      header {
        padding: 1.25rem;
        grid-template-columns: 100px 1fr;
      }
      h1 { font-size: 1.4rem; }
      .episode-header {
        flex-direction: column;
        gap: 0.25rem;
      }
    }
  </style>
</head>
<body>

<main>
  <header id="podcast-header">
    <p>Loading show details...</p>
  </header>

  <nav class="season-nav" id="season-tabs">
    <!-- Season filter buttons injected here -->
  </nav>

  <section>
    <div id="episodes-container">
      <p>Loading episodes...</p>
    </div>
  </section>
</main>

<footer id="podcast-footer"></footer>

<script>
  const RSS_URL = 'https://heavenspecial.github.io/radio/feed.xml';
  const ITUNES_NS = 'http://www.itunes.com/dtds/podcast-1.0.dtd';

  let allEpisodes = [];
  let currentSeasonFilter = 'ALL';

  function formatTime(seconds) {
    if (isNaN(seconds)) return '0:00';
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = Math.floor(seconds % 60);
    const formattedSecs = secs < 10 ? `0${secs}` : secs;

    if (hrs > 0) {
      const formattedMins = mins < 10 ? `0${mins}` : mins;
      return `${hrs}:${formattedMins}:${formattedSecs}`;
    }
    return `${mins}:${formattedSecs}`;
  }

  async function loadPodcastFeed() {
    try {
      const response = await fetch(RSS_URL);
      const textData = await response.text();
      const parser = new DOMParser();
      const xml = parser.parseFromString(textData, 'application/xml');

      const channel = xml.querySelector('channel');

      const getNS = (parent, ns, tag) => {
        const el = parent.getElementsByTagNameNS(ns, tag)[0];
        return el ? el.textContent.trim() : '';
      };

      const getTagText = (parent, tag) => {
        const el = parent.querySelector(tag);
        return el ? el.textContent.trim() : '';
      };

      // Header Info Extraction
      const podcastTitle = getTagText(channel, 'title');
      const podcastAuthor = getNS(channel, ITUNES_NS, 'author');
      const podcastDesc = getTagText(channel, 'description');
      const podcastSummary = getNS(channel, ITUNES_NS, 'summary') || podcastDesc;
      const isExplicit = getNS(channel, ITUNES_NS, 'explicit').toLowerCase() === 'yes';

      const categories = Array.from(channel.getElementsByTagNameNS(ITUNES_NS, 'category'))
                              .map(cat => cat.getAttribute('text'));

      const imageNode = channel.getElementsByTagNameNS(ITUNES_NS, 'image')[0];
      const imageUrl = imageNode ? imageNode.getAttribute('href') : 'https://heavenspecial.github.io/radio/artwork/album.jpg';

      document.title = podcastTitle;

      document.getElementById('podcast-header').innerHTML = `
        <img src="${imageUrl}" alt="${podcastTitle} Cover Art">
        <div class="show-details">
          <div class="meta-line">
            ${podcastAuthor ? `<span class="author">${podcastAuthor}</span>` : ''}
            ${isExplicit ? `<span class="explicit-badge">Explicit</span>` : ''}
          </div>
          <h1>${podcastTitle}</h1>
          <div class="tags">
            ${categories.map(cat => `<span class="tag">${cat}</span>`).join('')}
          </div>
        </div>
        <div class="show-description">${podcastDesc}</div>
      `;

      document.getElementById('podcast-footer').textContent = podcastSummary;

      // Extract Episodes & Season Metadata
      const items = xml.querySelectorAll('item');
      const seasonsSet = new Set();

      allEpisodes = Array.from(items).map((item, index) => {
        const season = getNS(item, ITUNES_NS, 'season');
        const episode = getNS(item, ITUNES_NS, 'episode');
        const episodeType = getNS(item, ITUNES_NS, 'episodeType') || 'full';
        
        if (season) seasonsSet.add(season);

        const rawGuid = getTagText(item, 'guid') || `ep-${index}`;
        const guid = rawGuid.includes('/') ? rawGuid.split('/').pop() : rawGuid;

        return {
          title: getTagText(item, 'title'),
          desc: getTagText(item, 'description'),
          guid: guid,
          pubDateRaw: getTagText(item, 'pubDate'),
          audioUrl: item.querySelector('enclosure')?.getAttribute('url') || '',
          season: season || null,
          episode: episode || null,
          episodeType: episodeType,
          index: index
        };
      });

      renderSeasonTabs(Array.from(seasonsSet).sort((a, b) => b - a));
      renderEpisodes();

      // Deep Linking Support
      if (window.location.hash) {
        const targetId = window.location.hash.substring(1);
        const targetEp = allEpisodes.find(e => e.guid === targetId);
        if (targetEp && targetEp.season) {
          switchSeason(targetEp.season);
        }
        setTimeout(() => {
          const targetEl = document.getElementById(targetId);
          if (targetEl) targetEl.scrollIntoView({ behavior: 'smooth' });
        }, 100);
      }

    } catch (err) {
      console.error('Error fetching/parsing XML feed:', err);
    }
  }

  function renderSeasonTabs(seasons) {
    const tabsContainer = document.getElementById('season-tabs');
    tabsContainer.innerHTML = `
      <button class="season-tab active" onclick="switchSeason('ALL')">All Episodes</button>
      ${seasons.map(s => `<button class="season-tab" onclick="switchSeason('${s}')">Season ${s}</button>`).join('')}
      <button class="season-tab" onclick="switchSeason('BONUS')">Extras / Pilots</button>
    `;
  }

  function switchSeason(seasonKey) {
    currentSeasonFilter = seasonKey;
    document.querySelectorAll('.season-tab').forEach(btn => {
      btn.classList.toggle('active', 
        (seasonKey === 'ALL' && btn.textContent === 'All Episodes') ||
        (seasonKey === 'BONUS' && btn.textContent.includes('Extras')) ||
        btn.textContent === `Season ${seasonKey}`
      );
    });
    renderEpisodes();
  }

  function renderEpisodes() {
    const container = document.getElementById('episodes-container');
    container.innerHTML = '';

    const filtered = allEpisodes.filter(ep => {
      if (currentSeasonFilter === 'ALL') return true;
      if (currentSeasonFilter === 'BONUS') return !ep.season;
      return ep.season === currentSeasonFilter;
    });

    filtered.forEach(ep => {
      const pubDate = ep.pubDateRaw ? new Date(ep.pubDateRaw).toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      }) : '';

      const article = document.createElement('article');
      article.className = 'episode';
      article.id = ep.guid;

      article.innerHTML = `
        <div class="episode-header">
          <div class="episode-title-group">
            <div class="episode-badge-row">
              <span class="ep-type-badge ${ep.episodeType}">${ep.episodeType}</span>
              ${ep.season ? `<span style="font-size:0.75rem; color:var(--text-sub);">S${ep.season} E${ep.episode}</span>` : ''}
            </div>
            <h3><a href="#${ep.guid}" class="episode-title">${ep.title}</a></h3>
          </div>
          <time class="episode-date">${pubDate}</time>
        </div>
        <div class="episode-description">${ep.desc}</div>
        
        ${ep.audioUrl ? `
          <div class="custom-player" id="player-${ep.index}">
            <audio src="${ep.audioUrl}" preload="metadata"></audio>
            
            <div class="player-controls-row">
              <button class="btn-skip btn-rewind" title="Rewind 15s">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                  <path d="M3 3v5h5"/>
                  <text x="12" y="15.5" font-size="7" font-weight="800" fill="currentColor" stroke="none" text-anchor="middle">15</text>
                </svg>
              </button>

              <button class="btn-play-pause" title="Play">
                <svg class="icon-play" viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"></polygon></svg>
                <svg class="icon-pause" viewBox="0 0 24 24" style="display: none;">
                  <rect x="6" y="4" width="4" height="16"></rect>
                  <rect x="14" y="4" width="4" height="16"></rect>
                </svg>
              </button>

              <button class="btn-skip btn-ff" title="Fast Forward 30s">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                  <path d="M21 3v5h-5"/>
                  <text x="12" y="15.5" font-size="7" font-weight="800" fill="currentColor" stroke="none" text-anchor="middle">30</text>
                </svg>
              </button>
            </div>

            <div class="timeline-container">
              <input type="range" class="seek-slider" min="0" max="100" value="0">
              <div class="time-display">
                <span class="time-current">0:00</span>
                <span class="time-duration">0:00</span>
              </div>
            </div>
          </div>
        ` : ''}
      `;

      container.appendChild(article);

      if (ep.audioUrl) {
        setupPlayerControls(document.getElementById(`player-${ep.index}`));
      }
    });
  }

  function setupPlayerControls(playerEl) {
    const audio = playerEl.querySelector('audio');
    const playPauseBtn = playerEl.querySelector('.btn-play-pause');
    const iconPlay = playerEl.querySelector('.icon-play');
    const iconPause = playerEl.querySelector('.icon-pause');
    const rewindBtn = playerEl.querySelector('.btn-rewind');
    const ffBtn = playerEl.querySelector('.btn-ff');
    const slider = playerEl.querySelector('.seek-slider');
    const timeCurrent = playerEl.querySelector('.time-current');
    const timeDuration = playerEl.querySelector('.time-duration');

    audio.addEventListener('loadedmetadata', () => {
      timeDuration.textContent = formatTime(audio.duration);
    });

    playPauseBtn.addEventListener('click', () => {
      document.querySelectorAll('audio').forEach(otherAudio => {
        if (otherAudio !== audio) otherAudio.pause();
      });

      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play', () => {
      iconPlay.style.display = 'none';
      iconPause.style.display = 'block';
    });

    audio.addEventListener('pause', () => {
      iconPlay.style.display = 'block';
      iconPause.style.display = 'none';
    });

    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        const percentage = (audio.currentTime / audio.duration) * 100;
        slider.value = percentage;
        slider.style.background = `linear-gradient(to right, var(--lavender-miniskirt) 0%, var(--lavender-miniskirt) ${percentage}%, rgba(255, 255, 255, 0.15) ${percentage}%, rgba(255, 255, 255, 0.15) 100%)`;
        timeCurrent.textContent = formatTime(audio.currentTime);
      }
    });

    slider.addEventListener('input', () => {
      if (!isNaN(audio.duration)) {
        audio.currentTime = (slider.value / 100) * audio.duration;
      }
    });

    rewindBtn.addEventListener('click', () => audio.currentTime = Math.max(0, audio.currentTime - 15));
    ffBtn.addEventListener('click', () => audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + 30));
  }

  loadPodcastFeed();
</script>

</body>
</html>
