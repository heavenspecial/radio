<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bimbo Kimchi: Chase the Myth</title>
  <style>
    :root {
      --bg: #030305;
      --panel: #0e0e13;
      --panel-border: rgba(255, 255, 255, 0.08);
      --accent: #fce5bf;
      --text: #e6e6ed;
      --secondary-text: #9393a5;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-bg-hover: rgba(255, 255, 255, 0.06);
      --explicit-color: #ff2a5f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    main {
      max-width: 768px;
      width: 100%;
    }

    header {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 2rem;
      display: grid;
      grid-template-columns: minmax(100px, 160px) 1fr;
      grid-template-areas:
        "image details"
        "description description";
      gap: 1.5rem;
      align-items: center;
      margin-bottom: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    header img {
      grid-area: image;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--panel-border);
    }

    .show-details {
      grid-area: details;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .meta-line {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 1.8rem;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .author {
      font-size: 0.85rem;
      color: var(--secondary-text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .explicit-badge {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--explicit-color);
      border: 1px solid rgba(255, 42, 95, 0.3);
      background: rgba(255, 42, 95, 0.1);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
    }

    .tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .tag {
      background: var(--glass-bg);
      color: var(--accent);
      border: 1px solid var(--panel-border);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .show-description {
      grid-area: description;
      font-size: 0.95rem;
      color: var(--text);
    }

    /* Segmented Controls / Filter Wrapper */
    .filter-wrapper {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 2rem;
    }

    .segmented-control {
      display: flex;
      background: var(--panel);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
      gap: 4px;
    }

    .segmented-btn {
      background: transparent;
      border: none;
      color: var(--secondary-text);
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .segmented-btn:hover {
      color: #fff;
    }

    .segmented-btn.active {
      background: var(--glass-bg-hover);
      color: var(--accent);
    }

    /* Season Group Headings */
    .season-title {
      font-size: 1.1rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 1.5rem 0 1rem 0;
    }

    article.episode {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      scroll-margin-top: 2rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    article.episode:target {
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(252, 229, 191, 0.15);
    }

    .episode-meta-tag {
      font-size: 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
      font-weight: 600;
    }

    .episode-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .episode-title {
      font-size: 1.25rem;
      color: #fff;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .episode-title:hover {
      color: var(--accent);
    }

    .episode-date {
      font-size: 0.8rem;
      color: var(--secondary-text);
      white-space: nowrap;
    }

    .episode-description {
      font-size: 0.9rem;
      color: var(--secondary-text);
      margin-bottom: 1.5rem;
    }

    /* Player Controls Styling */
    .custom-player {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 1rem;
    }

    .player-controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }

    .btn-skip {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
    }

    .btn-skip svg,
    .btn-skip text {
      pointer-events: none; /* Prevents event bubbling issues on child elements */
    }

    .btn-skip:active {
      transform: scale(0.9);
    }

    .btn-play-pause {
      background-color: var(--accent);
      border: none;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(252, 229, 191, 0.2);
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .btn-play-pause:active {
      transform: scale(0.95);
    }

    .btn-play-pause svg {
      fill: #000;
      width: 24px;
      height: 24px;
    }

    .timeline-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .seek-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.12);
      outline: none;
      cursor: pointer;
    }

    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--accent);
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
    }

    .seek-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--accent);
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--secondary-text);
      font-weight: 500;
    }

    footer {
      max-width: 768px;
      width: 100%;
      margin-top: 2rem;
      padding: 1rem 0;
      text-align: center;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--secondary-text);
    }

    @media (max-width: 650px) {
      header {
        grid-template-columns: 1fr;
        grid-template-areas:
          "image"
          "details"
          "description";
        text-align: center;
        padding: 1.5rem;
      }
      header img { margin: 0 auto; }
      .meta-line, .tags { justify-content: center; }
      .episode-header { flex-direction: column; gap: 0.25rem; }
      .filter-wrapper { justify-content: center; }
    }
  </style>
</head>
<body>

<main>
  <header id="podcast-header">
    <p>Loading show details...</p>
  </header>

  <div class="filter-wrapper">
    <div class="segmented-control" id="season-picker">
      <button class="segmented-btn active" data-filter="all">All</button>
      <button class="segmented-btn" data-filter="2">Season 2</button>
      <button class="segmented-btn" data-filter="1">Season 1</button>
      <button class="segmented-btn" data-filter="trailer">Pilot</button>
    </div>
  </div>

  <div id="episodes-container">
    <p>Loading episodes...</p>
  </div>
</main>

<footer id="podcast-footer"></footer>

<script>
  const RSS_URL = 'https://heavenspecial.github.io/radio/feed.xml';
  const ITUNES_NS = 'http://www.itunes.com/dtds/podcast-1.0.dtd';

  function formatTime(seconds) {
    if (isNaN(seconds)) return '0:00';
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = Math.floor(seconds % 60);
    const formattedSecs = secs < 10 ? `0${secs}` : secs;
    if (hrs > 0) {
      const formattedMins = mins < 10 ? `0${mins}` : mins;
      return `${hrs}:${formattedMins}:${formattedSecs}`;
    }
    return `${mins}:${formattedSecs}`;
  }

  async function loadPodcastFeed() {
    try {
      const response = await fetch(RSS_URL);
      const textData = await response.text();
      const parser = new DOMParser();
      const xml = parser.parseFromString(textData, 'application/xml');

      const channel = xml.querySelector('channel');

      const getNS = (parent, ns, tag) => {
        const el = parent.getElementsByTagNameNS(ns, tag)[0];
        return el ? el.textContent.trim() : '';
      };

      const getTagText = (parent, tag) => {
        const el = parent.querySelector(tag);
        return el ? el.textContent.trim() : '';
      };

      // Header Meta
      const podcastTitle = getTagText(channel, 'title');
      const podcastAuthor = getNS(channel, ITUNES_NS, 'author');
      const podcastDesc = getTagText(channel, 'description');
      const podcastSummary = getNS(channel, ITUNES_NS, 'summary') || podcastDesc;
      const isExplicit = getNS(channel, ITUNES_NS, 'explicit').toLowerCase() === 'yes';
      const categories = Array.from(channel.getElementsByTagNameNS(ITUNES_NS, 'category')).map(cat => cat.getAttribute('text'));
      const imageNode = channel.getElementsByTagNameNS(ITUNES_NS, 'image')[0];
      const imageUrl = imageNode ? imageNode.getAttribute('href') : 'https://heavenspecial.github.io/radio/artwork/album.jpg';

      document.title = podcastTitle;

      document.getElementById('podcast-header').innerHTML = `
        <img src="${imageUrl}" alt="${podcastTitle} Cover Art">
        <div class="show-details">
          <div class="meta-line">
            ${podcastAuthor ? `<span class="author">${podcastAuthor}</span>` : ''}
            ${isExplicit ? `<span class="explicit-badge">Explicit</span>` : ''}
          </div>
          <h1>${podcastTitle}</h1>
          <div class="tags">
            ${categories.map(cat => `<span class="tag">${cat}</span>`).join('')}
          </div>
        </div>
        <div class="show-description">${podcastDesc}</div>
      `;

      document.getElementById('podcast-footer').textContent = podcastSummary;

      // Extract Episodes
      const items = Array.from(xml.querySelectorAll('item'));
      const episodesData = items.map((item, index) => {
        const title = getTagText(item, 'title');
        const desc = getTagText(item, 'description');
        const rawGuid = getTagText(item, 'guid') || `ep-${index}`;
        const guid = rawGuid.includes('/') ? rawGuid.split('/').pop() : rawGuid;
        const pubDateRaw = getTagText(item, 'pubDate');
        const season = getNS(item, ITUNES_NS, 'season');
        const episode = getNS(item, ITUNES_NS, 'episode');
        const type = getNS(item, ITUNES_NS, 'episodeType') || 'full';

        const pubDate = pubDateRaw ? new Date(pubDateRaw).toLocaleDateString('en-US', {
          year: 'numeric', month: 'short', day: 'numeric'
        }) : '';

        const enclosure = item.querySelector('enclosure');
        const audioUrl = enclosure ? enclosure.getAttribute('url') : '';

        return { index, title, desc, guid, pubDate, season, episode, type, audioUrl };
      });

      renderEpisodes(episodesData);
      setupSegmentedControl(episodesData);

      // Deep Linking Handling
      if (window.location.hash) {
        const targetId = window.location.hash.substring(1);
        const targetEl = document.getElementById(targetId);
        if (targetEl) {
          targetEl.scrollIntoView({ behavior: 'smooth' });
          const currentHash = window.location.hash;
          history.replaceState(null, '', ' ');
          window.location.hash = currentHash;
        }
      }

    } catch (err) {
      console.error('Error loading XML feed:', err);
    }
  }

  function renderEpisodes(episodes, filterSeason = 'all') {
    const container = document.getElementById('episodes-container');
    container.innerHTML = '';

    let filtered = episodes;
    if (filterSeason === 'trailer') {
      filtered = episodes.filter(ep => ep.type === 'trailer' || !ep.season);
    } else if (filterSeason !== 'all') {
      filtered = episodes.filter(ep => ep.season === filterSeason);
    }

    if (filtered.length === 0) {
      container.innerHTML = `<p style="color: var(--secondary-text); padding: 2rem 0;">No episodes found for this selection.</p>`;
      return;
    }

    const groups = {};
    filtered.forEach(ep => {
      let groupKey = 'Pilot';
      if (ep.season) groupKey = `Season ${ep.season}`;
      if (!groups[groupKey]) groups[groupKey] = [];
      groups[groupKey].push(ep);
    });

    Object.keys(groups).forEach(groupName => {
      const groupSection = document.createElement('section');
      groupSection.className = 'season-group';

      if (filterSeason === 'all') {
        const titleEl = document.createElement('h2');
        titleEl.className = 'season-title';
        titleEl.textContent = groupName;
        groupSection.appendChild(titleEl);
      }

      groups[groupName].forEach(ep => {
        const article = document.createElement('article');
        article.className = 'episode';
        article.id = ep.guid;

        const subTag = ep.season && ep.episode ? `Season ${ep.season} • Episode ${ep.episode}` : (ep.type === 'trailer' ? 'Bonus / Trailer' : 'Special');

        article.innerHTML = `
          <div class="episode-meta-tag">${subTag}</div>
          <div class="episode-header">
            <h3><a href="#${ep.guid}" class="episode-title">${ep.title}</a></h3>
            <time class="episode-date">${ep.pubDate}</time>
          </div>
          <div class="episode-description">${ep.desc}</div>
          
          ${ep.audioUrl ? `
            <div class="custom-player" id="player-${ep.index}">
              <audio src="${ep.audioUrl}" preload="metadata"></audio>
              <div class="player-controls-row">
                <button class="btn-skip btn-rewind" title="Rewind 15s">
                  <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                    <text x="12" y="15.5" font-size="6.5" font-weight="800" fill="currentColor" stroke="none" text-anchor="middle">15</text>
                  </svg>
                </button>
                <button class="btn-play-pause" title="Play">
                  <svg class="icon-play" viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"></polygon></svg>
                  <svg class="icon-pause" viewBox="0 0 24 24" style="display: none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                </button>
                <button class="btn-skip btn-ff" title="Fast Forward 30s">
                  <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                    <path d="M21 3v5h-5"/>
                    <text x="12" y="15.5" font-size="6.5" font-weight="800" fill="currentColor" stroke="none" text-anchor="middle">30</text>
                  </svg>
                </button>
              </div>
              <div class="timeline-container">
                <input type="range" class="seek-slider" min="0" max="100" value="0">
                <div class="time-display">
                  <span class="time-current">0:00</span>
                  <span class="time-duration">0:00</span>
                </div>
              </div>
            </div>
          ` : ''}
        `;

        groupSection.appendChild(article);
      });

      container.appendChild(groupSection);
    });

    // Re-bind Player Events
    filtered.forEach(ep => {
      if (ep.audioUrl) {
        setupPlayerControls(document.getElementById(`player-${ep.index}`));
      }
    });
  }

  function setupSegmentedControl(episodesData) {
    const buttons = document.querySelectorAll('.segmented-btn');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.getAttribute('data-filter');
        renderEpisodes(episodesData, filter);
      });
    });
  }

  function setupPlayerControls(playerEl) {
    if (!playerEl) return;
    const audio = playerEl.querySelector('audio');
    const playPauseBtn = playerEl.querySelector('.btn-play-pause');
    const iconPlay = playerEl.querySelector('.icon-play');
    const iconPause = playerEl.querySelector('.icon-pause');
    const rewindBtn = playerEl.querySelector('.btn-rewind');
    const ffBtn = playerEl.querySelector('.btn-ff');
    const slider = playerEl.querySelector('.seek-slider');
    const timeCurrent = playerEl.querySelector('.time-current');
    const timeDuration = playerEl.querySelector('.time-duration');

    audio.addEventListener('loadedmetadata', () => {
      timeDuration.textContent = formatTime(audio.duration);
    });

    playPauseBtn.addEventListener('click', () => {
      document.querySelectorAll('audio').forEach(other => {
        if (other !== audio) other.pause();
      });
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play', () => {
      iconPlay.style.display = 'none';
      iconPause.style.display = 'block';
    });

    audio.addEventListener('pause', () => {
      iconPlay.style.display = 'block';
      iconPause.style.display = 'none';
    });

    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        const percentage = (audio.currentTime / audio.duration) * 100;
        slider.value = percentage;
        slider.style.background = `linear-gradient(to right, var(--accent) 0%, var(--accent) ${percentage}%, rgba(255, 255, 255, 0.12) ${percentage}%, rgba(255, 255, 255, 0.12) 100%)`;
        timeCurrent.textContent = formatTime(audio.currentTime);
      }
    });

    slider.addEventListener('input', () => {
      if (!isNaN(audio.duration)) {
        audio.currentTime = (slider.value / 100) * audio.duration;
      }
    });

    if (rewindBtn) {
      rewindBtn.addEventListener('click', () => {
        audio.currentTime = Math.max(0, audio.currentTime - 15);
      });
    }

    if (ffBtn) {
      ffBtn.addEventListener('click', () => {
        audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + 30);
      });
    }
  }

  window.addEventListener('DOMContentLoaded', loadPodcastFeed);
</script>
</body>
</html>
