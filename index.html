<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bimbo Kimchi: Chase the Myth</title>
  <style>
    :root {
      --bg: #121212;
      --panel: #1e1e1e;
      --panel-hover: #252525;
      --accent: #fce5bf;
      --scrub-blue: #ae96cb;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --border: rgba(255, 255, 255, 0.08);
      --explicit-color: #ff3b30;
      --button-purple: #7851a9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      line-height: 1.5;
      padding: 3rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 800px;
      width: 100%;
    }

    /* --- HERO SHOW HEADER --- */
    header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2rem;
      display: grid;
      grid-template-columns: 160px 1fr;
      grid-template-areas:
        "image details"
        "description description";
      gap: 1.5rem 2rem;
      align-items: center;
      margin-bottom: 2.5rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
    }

    header img {
      grid-area: image;
      width: 160px;
      height: 160px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .show-details {
      grid-area: details;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      min-width: 0;
    }

    .meta-line {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: #fff;
      line-height: 1.2;
    }

    .author {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .explicit-badge {
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--explicit-color);
      border: 1px solid rgba(255, 59, 48, 0.3);
      background: rgba(255, 59, 48, 0.12);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }

    .tags {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.4rem;
      flex-wrap: wrap;
    }

    .tag {
      background: rgba(252, 229, 191, 0.1);
      color: var(--accent);
      border: 1px solid rgba(252, 229, 191, 0.2);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .show-description {
      grid-area: description;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.8);
      border-top: 1px solid var(--border);
      padding-top: 1.25rem;
    }

    /* --- SEASON SECTIONS --- */
    .season-group {
      margin-bottom: 3rem;
    }

    .season-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--accent);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .season-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* --- EPISODE CARD --- */
    article.episode {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
      scroll-margin-top: 2rem;
      transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    article.episode:hover {
      background: var(--panel-hover);
    }

    article.episode:target {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(252, 229, 191, 0.15);
    }

    .episode-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }

    .episode-badge-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
    }

    .ep-badge {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .ep-badge.trailer {
      color: var(--accent);
      background: rgba(252, 229, 191, 0.15);
    }

    .episode-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .episode-title:hover {
      color: var(--accent);
    }

    .episode-date {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      font-weight: 500;
    }

    /* Expandable Description Details */
    .episode-details {
      margin-bottom: 1rem;
    }

    .episode-details summary {
      font-size: 0.85rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .episode-details summary:hover {
      color: var(--accent);
    }

    .episode-description {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 0.5rem;
      padding-left: 0.5rem;
      border-left: 2px solid var(--border);
    }

    /* --- AUDIO PLAYER --- */
    .custom-player {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .player-controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }

    .btn-skip {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, opacity 0.2s ease;
      opacity: 0.85;
    }

    .btn-skip:hover {
      opacity: 1;
    }

    .btn-skip:active {
      transform: scale(0.9);
    }

    .btn-play-pause {
      background-color: var(--button-purple);
      border: none;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(120, 81, 169, 0.4);
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .btn-play-pause:hover {
      transform: scale(1.04);
    }

    .btn-play-pause:active {
      transform: scale(0.95);
    }

    .btn-play-pause svg {
      fill: #ffffff;
      width: 22px;
      height: 22px;
    }

    /* Timeline & Slider */
    .timeline-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .seek-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 3px;
      background: linear-gradient(to right, var(--scrub-blue) 0%, var(--scrub-blue) 0%, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.15) 100%);
      outline: none;
      cursor: pointer;
    }

    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--scrub-blue);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .seek-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--scrub-blue);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    footer {
      max-width: 800px;
      width: 100%;
      margin-top: 2rem;
      padding: 1.5rem 0;
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 0.03em;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      body { padding: 1.5rem 0.75rem; }
      header {
        grid-template-columns: 1fr;
        grid-template-areas:
          "image"
          "details"
          "description";
        justify-items: center;
        text-align: center;
        padding: 1.5rem;
      }
      header img { width: 140px; height: 140px; }
      .meta-line { justify-content: center; }
      .tags { justify-content: center; }
      .episode-header { flex-direction: column; gap: 0.25rem; }
      .player-controls-row { gap: 1.5rem; }
    }
  </style>
</head>
<body>

<main>
  <header id="podcast-header">
    <p>Loading show details...</p>
  </header>

  <section id="episodes-container">
    <p>Loading episodes...</p>
  </section>
</main>

<footer id="podcast-footer"></footer>

<script>
  const RSS_URL = 'https://heavenspecial.github.io/radio/feed.xml';
  const ITUNES_NS = 'http://www.itunes.com/dtds/podcast-1.0.dtd';

  function formatTime(seconds) {
    if (isNaN(seconds)) return '0:00';
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = Math.floor(seconds % 60);
    const formattedSecs = secs < 10 ? `0${secs}` : secs;

    if (hrs > 0) {
      const formattedMins = mins < 10 ? `0${mins}` : mins;
      return `${hrs}:${formattedMins}:${formattedSecs}`;
    }
    return `${mins}:${formattedSecs}`;
  }

  async function loadPodcastFeed() {
    try {
      const response = await fetch(RSS_URL);
      const textData = await response.text();
      const parser = new DOMParser();
      const xml = parser.parseFromString(textData, 'application/xml');

      const channel = xml.querySelector('channel');

      const getNS = (parent, ns, tag) => {
        const el = parent.getElementsByTagNameNS(ns, tag)[0];
        return el ? el.textContent.trim() : '';
      };

      const getTagText = (parent, tag) => {
        const el = parent.querySelector(tag);
        return el ? el.textContent.trim() : '';
      };

      // Header details
      const podcastTitle = getTagText(channel, 'title');
      const podcastAuthor = getNS(channel, ITUNES_NS, 'author');
      const podcastDesc = getTagText(channel, 'description');
      const podcastSummary = getNS(channel, ITUNES_NS, 'summary') || podcastDesc;
      const isExplicit = getNS(channel, ITUNES_NS, 'explicit').toLowerCase() === 'yes';

      const categories = Array.from(channel.getElementsByTagNameNS(ITUNES_NS, 'category'))
                              .map(cat => cat.getAttribute('text'));

      const imageNode = channel.getElementsByTagNameNS(ITUNES_NS, 'image')[0];
      const imageUrl = imageNode ? imageNode.getAttribute('href') : 'https://heavenspecial.github.io/radio/artwork/album.jpg';

      document.title = podcastTitle;

      document.getElementById('podcast-header').innerHTML = `
        <img src="${imageUrl}" alt="${podcastTitle} Cover Art">
        <div class="show-details">
          <div class="meta-line">
            ${podcastAuthor ? `<span class="author">${podcastAuthor}</span>` : ''}
            ${isExplicit ? `<span class="explicit-badge">Explicit</span>` : ''}
          </div>
          <h1>${podcastTitle}</h1>
          <div class="tags">
            ${categories.map(cat => `<span class="tag">${cat}</span>`).join('')}
          </div>
        </div>
        <div class="show-description">${podcastDesc}</div>
      `;

      document.getElementById('podcast-footer').textContent = podcastSummary;

      // Episodes grouped by Season
      const items = Array.from(xml.querySelectorAll('item'));
      const seasonsMap = new Map();

      items.forEach((item, index) => {
        const seasonNum = getNS(item, ITUNES_NS, 'season');
        const episodeNum = getNS(item, ITUNES_NS, 'episode');
        const episodeType = getNS(item, ITUNES_NS, 'episodeType') || 'full';
        
        const groupKey = seasonNum ? `Season ${seasonNum}` : (episodeType === 'trailer' ? 'Bonus / Pilot' : 'Other Episodes');
        
        if (!seasonsMap.has(groupKey)) {
          seasonsMap.set(groupKey, []);
        }

        seasonsMap.get(groupKey).push({
          item,
          index,
          seasonNum,
          episodeNum,
          episodeType
        });
      });

      const container = document.getElementById('episodes-container');
      container.innerHTML = '';

      // Render Season Sections
      seasonsMap.forEach((episodes, seasonGroupTitle) => {
        const seasonSec = document.createElement('section');
        seasonSec.className = 'season-group';

        const seasonHeader = document.createElement('h2');
        seasonHeader.className = 'season-title';
        seasonHeader.textContent = seasonGroupTitle;
        seasonSec.appendChild(seasonHeader);

        episodes.forEach(({ item, index, seasonNum, episodeNum, episodeType }) => {
          const title = getTagText(item, 'title');
          const desc = getTagText(item, 'description');
          const rawGuid = getTagText(item, 'guid') || `ep-${index}`;
          const guid = rawGuid.includes('/') ? rawGuid.split('/').pop() : rawGuid;
          const pubDateRaw = getTagText(item, 'pubDate');

          const pubDate = pubDateRaw ? new Date(pubDateRaw).toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'short',
            day: 'numeric'
          }) : '';

          const enclosure = item.querySelector('enclosure');
          const audioUrl = enclosure ? enclosure.getAttribute('url') : '';

          // Generate episode badge label
          let badgeLabel = '';
          if (episodeType === 'trailer') {
            badgeLabel = 'Trailer';
          } else if (seasonNum && episodeNum) {
            badgeLabel = `S${seasonNum} E${episodeNum}`;
          }

          const article = document.createElement('article');
          article.className = 'episode';
          article.id = guid;

          article.innerHTML = `
            <div class="episode-header">
              <div>
                <div class="episode-badge-row">
                  ${badgeLabel ? `<span class="ep-badge ${episodeType}">${badgeLabel}</span>` : ''}
                </div>
                <h3><a href="#${guid}" class="episode-title">${title}</a></h3>
              </div>
              <time class="episode-date">${pubDate}</time>
            </div>

            <details class="episode-details">
              <summary>Show Notes</summary>
              <div class="episode-description">${desc}</div>
            </details>
            
            ${audioUrl ? `
              <div class="custom-player" id="player-${index}">
                <audio src="${audioUrl}" preload="metadata"></audio>
                
                <div class="player-controls-row">
                  <button class="btn-skip btn-rewind" title="Rewind 15 seconds">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                      <path d="M3 3v5h5"/>
                      <text x="12" y="15.5" font-size="6.5" font-weight="800" fill="currentColor" stroke="none" text-anchor="middle" font-family="-apple-system, sans-serif">15</text>
                    </svg>
                  </button>

                  <button class="btn-play-pause" title="Play">
                    <svg class="icon-play" viewBox="0 0 24 24">
                      <polygon points="7,4 20,12 7,20"></polygon>
                    </svg>
                    <svg class="icon-pause" viewBox="0 0 24 24" style="display: none;">
                      <rect x="6" y="4" width="4" height="16"></rect>
                      <rect x="14" y="4" width="4" height="16"></rect>
                    </svg>
                  </button>

                  <button class="btn-skip btn-ff" title="Fast forward 30 seconds">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                      <path d="M21 3v5h-5"/>
                      <text x="12" y="15.5" font-size="6.5" font-weight="800" fill="currentColor" stroke="none" text-anchor="middle" font-family="-apple-system, sans-serif">30</text>
                    </svg>
                  </button>
                </div>

                <div class="timeline-container">
                  <input type="range" class="seek-slider" min="0" max="100" value="0">
                  <div class="time-display">
                    <span class="time-current">0:00</span>
                    <span class="time-duration">0:00</span>
                  </div>
                </div>
              </div>
            ` : ''}
          `;

          seasonSec.appendChild(article);
        });

        container.appendChild(seasonSec);
      });

      // Bind controls after elements exist
      items.forEach((item, index) => {
        const playerEl = document.getElementById(`player-${index}`);
        if (playerEl) setupPlayerControls(playerEl);
      });

      // Handle deep linking hash scrolling
      if (window.location.hash) {
        const targetId = window.location.hash.substring(1);
        const targetEl = document.getElementById(targetId);
        if (targetEl) {
          targetEl.scrollIntoView({ behavior: 'smooth' });
          const currentHash = window.location.hash;
          history.replaceState(null, '', ' ');
          window.location.hash = currentHash;
        }
      }

    } catch (err) {
      console.error('Error fetching/parsing XML feed:', err);
    }
  }

  function setupPlayerControls(playerEl) {
    const audio = playerEl.querySelector('audio');
    const playPauseBtn = playerEl.querySelector('.btn-play-pause');
    const iconPlay = playerEl.querySelector('.icon-play');
    const iconPause = playerEl.querySelector('.icon-pause');
    const rewindBtn = playerEl.querySelector('.btn-rewind');
    const ffBtn = playerEl.querySelector('.btn-ff');
    const slider = playerEl.querySelector('.seek-slider');
    const timeCurrent = playerEl.querySelector('.time-current');
    const timeDuration = playerEl.querySelector('.time-duration');

    audio.addEventListener('loadedmetadata', () => {
      timeDuration.textContent = formatTime(audio.duration);
    });

    playPauseBtn.addEventListener('click', () => {
      document.querySelectorAll('audio').forEach(otherAudio => {
        if (otherAudio !== audio) otherAudio.pause();
      });

      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play', () => {
      iconPlay.style.display = 'none';
      iconPause.style.display = 'block';
    });

    audio.addEventListener('pause', () => {
      iconPlay.style.display = 'block';
      iconPause.style.display = 'none';
    });

    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        const percentage = (audio.currentTime / audio.duration) * 100;
        slider.value = percentage;
        slider.style.background = `linear-gradient(to right, var(--scrub-blue) 0%, var(--scrub-blue) ${percentage}%, rgba(255, 255, 255, 0.15) ${percentage}%, rgba(255, 255, 255, 0.15) 100%)`;
        timeCurrent.textContent = formatTime(audio.currentTime);
      }
    });

    slider.addEventListener('input', () => {
      if (!isNaN(audio.duration)) {
        audio.currentTime = (slider.value / 100) * audio.duration;
      }
    });

    rewindBtn.addEventListener('click', () => {
      audio.currentTime = Math.max(0, audio.currentTime - 15);
    });

    ffBtn.addEventListener('click', () => {
      audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + 30);
    });
  }

  loadPodcastFeed();
</script>

</body>
</html>
